<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520">
  <!-- Line 3, "Pallets of fresh food rotted out back": flat editorial illustration for the dark stage (replaces
       vince-forklift.svg; same 760x520 budget at left 160, top 300). The default pose is the ARRIVED, RAISED
       pose: the forks hold the pallet just above the dumpster rim. Animate FROM offsets back to this pose, then tip.
       Animatable parts (CSS transforms; use transform-box: view-box with the origins given):
         #fkBody     the whole forklift (chassis, mast, cab, operator, carriage). Drive in: translateX(+220px) -> 0.
         #fkCarriage forks + backrest. Lift: translateY(+150px) -> 0 (forks low while driving, up on arrival).
         #fkLoad     pallet + crates, a ROOT-level group (so the dumpster wall can hide what falls in). Give it
                     the same translateX as #fkBody and the same translateY as #fkCarriage.
         #fkTip      inside #fkLoad: the tip. rotate(0) -> rotate(-24deg), origin 140px 290px (the fork tips).
         #crate1-3   inside #fkTip: slide into the dumpster after the tip: translate(-70px, 150px) each, staggered
                     0.08 s; they vanish behind the dumpster's front wall through the clip-path (no fading needed).
         #fkLampGlow the wall lamp's light: opacity .85 <-> 1, slow (optional).
         #operator   inside #fkBody: tiny head turn toward the load: rotate(-6deg), origin 492px 236px (optional).
       Palette: the film's tokens plus darker shades of them (mustard forklift, sage dumpster, tan wood, rust/brown produce). -->
  <defs>
    <radialGradient id="fsWall" cx="50%" cy="30%" r="70%">
      <stop offset="0" stop-color="#232b30"/><stop offset=".65" stop-color="#1a2024"/><stop offset="1" stop-color="#121517"/>
    </radialGradient>
    <linearGradient id="fsTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121517"/><stop offset="1" stop-color="#121517" stop-opacity="0"/></linearGradient>
    <linearGradient id="fsBot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121517" stop-opacity="0"/><stop offset="1" stop-color="#121517"/></linearGradient>
    <radialGradient id="fsLamp" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#EAB62F" stop-opacity=".22"/><stop offset=".55" stop-color="#EAB62F" stop-opacity=".06"/><stop offset="1" stop-color="#EAB62F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fsGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2226"/><stop offset="1" stop-color="#121517"/>
    </linearGradient>
    <linearGradient id="fsFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000"/><stop offset=".08" stop-color="#fff"/><stop offset=".92" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="fsEdge"><rect width="760" height="520" fill="url(#fsFade)"/></mask>
    <!-- everything except the dumpster's interior below the rim: what falls in disappears behind the front wall -->
    <clipPath id="fsNotInDumpster"><path clip-rule="evenodd" d="M-400 -400 H1200 V1000 H-400 Z M34 302 H246 L232 470 H48 Z"/></clipPath>
  </defs>

  <!-- the yard at night: a wall, a lamp, the ground -->
  <g id="fkYard" mask="url(#fsEdge)">
    <rect width="760" height="420" fill="url(#fsWall)"/>
    <g stroke="#262e33" stroke-width="2" opacity=".7">
      <path d="M40 0V420M80 0V420M120 0V420M160 0V420M200 0V420M240 0V420M280 0V420M320 0V420M360 0V420M400 0V420M440 0V420M480 0V420M520 0V420M560 0V420M600 0V420M640 0V420M680 0V420M720 0V420"/>
    </g>
    <rect y="408" width="760" height="112" fill="url(#fsGround)"/>
    <rect y="406" width="760" height="3" fill="#2a3237"/>
    <g id="fkLampGlow"><ellipse cx="380" cy="230" rx="340" ry="250" fill="url(#fsLamp)"/></g>
    <rect width="760" height="110" fill="url(#fsTop)"/>
    <rect y="452" width="760" height="68" fill="url(#fsBot)"/>
    <rect x="356" y="36" width="48" height="16" rx="4" fill="#383F3B"/><rect x="364" y="50" width="32" height="5" rx="2" fill="#F6D36B"/>
  </g>

  <!-- abandoned pallets along the wall, browning produce (depth: darker, smaller) -->
  <g id="fkBackPallets" opacity=".7">
    <ellipse cx="672" cy="466" rx="92" ry="8" fill="#000" opacity=".35"/>
    <g fill="#8a7253"><rect x="590" y="446" width="166" height="8" rx="1"/><rect x="590" y="456" width="166" height="6" rx="1" opacity=".7"/><rect x="596" y="454" width="14" height="10"/><rect x="666" y="454" width="14" height="10"/><rect x="736" y="454" width="14" height="10"/></g>
    <g><rect x="598" y="400" width="74" height="46" rx="3" fill="#7d6346"/><rect x="598" y="414" width="74" height="4" fill="#5f4a34"/><rect x="598" y="428" width="74" height="4" fill="#5f4a34"/>
      <circle cx="612" cy="398" r="9" fill="#6e5232"/><circle cx="630" cy="395" r="10" fill="#7f5e36"/><circle cx="650" cy="397" r="9" fill="#5e4a2c"/><circle cx="664" cy="399" r="7" fill="#7a6a3e"/></g>
    <g><rect x="676" y="400" width="74" height="46" rx="3" fill="#7d6346"/><rect x="676" y="414" width="74" height="4" fill="#5f4a34"/><rect x="676" y="428" width="74" height="4" fill="#5f4a34"/>
      <ellipse cx="696" cy="396" rx="14" ry="8" fill="#56653a"/><ellipse cx="720" cy="395" rx="13" ry="8" fill="#6a5a30"/><ellipse cx="740" cy="398" rx="9" ry="6" fill="#4f5a35"/></g>
    <g><rect x="636" y="356" width="74" height="44" rx="3" fill="#86694a"/><rect x="636" y="370" width="74" height="4" fill="#64503a"/><rect x="636" y="384" width="74" height="4" fill="#64503a"/>
      <circle cx="652" cy="354" r="9" fill="#8a4a26"/><circle cx="670" cy="351" r="10" fill="#7a4424"/><circle cx="690" cy="353" r="9" fill="#6b4a2c"/></g>
  </g>

  <!-- the dumpster: back and lid (behind the load) -->
  <g id="fkDumpBack">
    <ellipse cx="140" cy="474" rx="118" ry="9" fill="#000" opacity=".45"/>
    <path d="M30 300 L250 300 L268 222 L44 206 Z" fill="#2b3e36"/>
    <path d="M44 206 L268 222 L266 230 L46 214 Z" fill="#3a5248"/>
    <path d="M36 300 H244 V306 H36 Z" fill="#1b2622"/>
    <g fill="#5e4a2c"><ellipse cx="88" cy="300" rx="22" ry="7"/><ellipse cx="150" cy="299" rx="26" ry="8" fill="#6b4a2c"/><ellipse cx="206" cy="300" rx="20" ry="6" fill="#4f5a35"/></g>
  </g>

  <!-- the forklift (Vince at the wheel), facing left -->
  <g id="fkBody">
    <ellipse cx="460" cy="476" rx="190" ry="11" fill="#000" opacity=".5"/>
    <!-- mast -->
    <rect x="276" y="112" width="12" height="344" rx="2" fill="#5b6064"/>
    <rect x="292" y="112" width="12" height="344" rx="2" fill="#6B6F6C"/>
    <rect x="279" y="112" width="3" height="344" fill="#868b8e"/>
    <rect x="272" y="108" width="36" height="10" rx="3" fill="#4a4f53"/>
    <rect x="272" y="250" width="36" height="7" fill="#4a4f53"/>
    <rect x="272" y="390" width="36" height="7" fill="#4a4f53"/>
    <rect x="309" y="230" width="7" height="200" rx="3" fill="#9a9fa1"/>
    <!-- carriage: backrest + forks -->
    <g id="fkCarriage">
      <rect x="258" y="150" width="20" height="142" rx="2" fill="#383F3B"/>
      <g stroke="#4a524e" stroke-width="3"><path d="M258 172H278M258 196H278M258 220H278M258 244H278M258 268H278"/></g>
      <path d="M262 150 V292" stroke="#58605c" stroke-width="3"/>
      <path d="M140 284 H270 V294 H146 Z" fill="#B8BBB6"/>
      <path d="M140 284 H270 V287 H142 Z" fill="#dcded9"/>
    </g>
    <!-- chassis -->
    <path d="M304 336 H566 Q582 336 586 352 L592 432 Q592 444 580 444 H312 Q302 444 302 432 Z" fill="#EAB62F"/>
    <path d="M304 336 H566 Q582 336 586 352 L587 356 H303 Z" fill="#F6D36B"/>
    <path d="M302 410 H592 V432 Q592 444 580 444 H312 Q302 444 302 432 Z" fill="#C9961F"/>
    <!-- counterweight -->
    <path d="M556 296 H618 Q648 296 652 330 L656 432 Q656 446 642 446 H556 Z" fill="#383F3B"/>
    <path d="M556 296 H618 Q640 296 646 312 H556 Z" fill="#4a524e"/>
    <rect x="620" y="360" width="26" height="6" rx="3" fill="#D16C02"/>
    <!-- overhead guard -->
    <path d="M318 338 L338 168" stroke="#2a302d" stroke-width="10" stroke-linecap="round"/>
    <path d="M552 300 L540 168" stroke="#2a302d" stroke-width="10" stroke-linecap="round"/>
    <path d="M330 166 H548" stroke="#2a302d" stroke-width="12" stroke-linecap="round"/>
    <path d="M360 166 V178 M400 166 V178 M440 166 V178 M480 166 V178 M520 166 V178" stroke="#2a302d" stroke-width="5"/>
    <!-- steering -->
    <path d="M372 336 L402 284" stroke="#2a302d" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="410" cy="280" rx="20" ry="6" transform="rotate(-30 410 280)" fill="none" stroke="#1f2422" stroke-width="5"/>
    <!-- seat -->
    <path d="M470 330 H540 Q548 330 546 320 L540 254 Q538 246 530 248 L520 250 L522 314 H474 Q466 316 470 330 Z" fill="#1f2422"/>
    <!-- operator: hard hat, hi-vis vest, gloves; no face (the figure suggests Vince, it does not portray him) -->
    <g id="operator">
      <path d="M470 318 Q450 318 452 330 L486 332 Q496 330 494 318 Z" fill="#262e33"/>
      <path d="M470 250 Q488 240 506 250 L512 318 Q492 324 468 318 Z" fill="#D16C02"/>
      <path d="M472 286 L510 284 M471 300 L511 299" stroke="#E8E2D6" stroke-width="5"/>
      <path d="M492 250 L492 318" stroke="#b55c00" stroke-width="2"/>
      <path d="M476 262 L440 282 L416 280" stroke="#262e33" stroke-width="11" stroke-linecap="round" fill="none"/>
      <circle cx="414" cy="279" r="7" fill="#6B6F6C"/>
      <rect x="485" y="232" width="14" height="18" rx="6" fill="#B98F6A"/>
      <circle cx="492" cy="224" r="17" fill="#C9A27E"/>
      <path d="M478 222 Q478 236 494 240 Q506 236 508 226 Q500 230 492 222 Z" fill="#2f2620" opacity=".85"/>
      <path d="M472 220 Q474 198 494 198 Q514 198 514 220 Z" fill="#FAF7F1"/>
      <path d="M466 220 H520 Q522 225 516 225 H468 Q463 225 466 220 Z" fill="#E8E2D6"/>
      <path d="M494 198 V220" stroke="#d8d2c6" stroke-width="3"/>
    </g>
    <!-- wheels -->
    <g><circle cx="352" cy="444" r="36" fill="#0b0d0e"/><circle cx="352" cy="444" r="18" fill="#4a4f53"/><circle cx="352" cy="444" r="7" fill="#B8BBB6"/><circle cx="352" cy="444" r="31" fill="none" stroke="#1d2124" stroke-width="3"/></g>
    <g><circle cx="560" cy="446" r="32" fill="#0b0d0e"/><circle cx="560" cy="446" r="16" fill="#4a4f53"/><circle cx="560" cy="446" r="6" fill="#B8BBB6"/><circle cx="560" cy="446" r="27" fill="none" stroke="#1d2124" stroke-width="3"/></g>
    <path d="M318 410 Q352 384 388 410" fill="none" stroke="#a87c14" stroke-width="5"/>
    <path d="M528 410 Q560 388 592 410" fill="none" stroke="#a87c14" stroke-width="5"/>
    <rect x="574" y="344" width="10" height="8" rx="2" fill="#D16C02"/>
  </g>

  <!-- the load: pallet + three crates of produce gone bad (root level, clipped at the dumpster's mouth) -->
  <g clip-path="url(#fsNotInDumpster)">
    <g id="fkLoad">
      <g id="fkTip">
        <!-- pallet -->
        <g>
          <rect x="142" y="270" width="128" height="6" rx="1" fill="#D0AE89"/>
          <rect x="142" y="277" width="128" height="7" fill="#b8956d"/>
          <rect x="146" y="276" width="14" height="8" fill="#9c7a54"/><rect x="199" y="276" width="14" height="8" fill="#9c7a54"/><rect x="252" y="276" width="14" height="8" fill="#9c7a54"/>
        </g>
        <g id="crate1">
          <rect x="146" y="226" width="58" height="44" rx="3" fill="#C49A6C"/>
          <rect x="146" y="240" width="58" height="4" fill="#9C7650"/><rect x="146" y="254" width="58" height="4" fill="#9C7650"/>
          <rect x="146" y="226" width="58" height="3" fill="#d8b688"/>
          <circle cx="158" cy="222" r="9" fill="#B5502A"/><circle cx="175" cy="219" r="10" fill="#9e4524"/><circle cx="192" cy="222" r="9" fill="#8A6A3E"/>
          <circle cx="172" cy="216" r="3" fill="#9aa38a" opacity=".8"/><circle cx="160" cy="219" r="2.5" fill="#5e4a2c"/>
        </g>
        <g id="crate2">
          <rect x="208" y="226" width="58" height="44" rx="3" fill="#C49A6C"/>
          <rect x="208" y="240" width="58" height="4" fill="#9C7650"/><rect x="208" y="254" width="58" height="4" fill="#9C7650"/>
          <rect x="208" y="226" width="58" height="3" fill="#d8b688"/>
          <ellipse cx="222" cy="221" rx="15" ry="9" fill="#6A9D8A"/><ellipse cx="246" cy="220" rx="14" ry="9" fill="#7a7a40"/><ellipse cx="258" cy="223" rx="8" ry="6" fill="#8A6A3E"/>
          <path d="M216 218 Q222 212 230 218" stroke="#4f7a6a" stroke-width="2" fill="none"/>
        </g>
        <g id="crate3">
          <rect x="176" y="182" width="58" height="44" rx="3" fill="#cfa776"/>
          <rect x="176" y="196" width="58" height="4" fill="#a17b54"/><rect x="176" y="210" width="58" height="4" fill="#a17b54"/>
          <rect x="176" y="182" width="58" height="3" fill="#e0c194"/>
          <circle cx="188" cy="178" r="8" fill="#8A6A3E"/><circle cx="204" cy="176" r="9" fill="#B5502A"/><circle cx="220" cy="178" r="8" fill="#7a4424"/>
          <circle cx="206" cy="172" r="2.5" fill="#9aa38a"/>
        </g>
      </g>
    </g>
  </g>

  <!-- the dumpster's front wall (over the load's lower half once it falls in) -->
  <g id="fkDumpFront">
    <path d="M34 302 H246 L232 466 H48 Z" fill="#3c5649"/>
    <path d="M34 302 H246 L245 312 H35 Z" fill="#4a6b5f"/>
    <g fill="#33493f"><rect x="70" y="318" width="12" height="138" rx="2"/><rect x="134" y="318" width="12" height="138" rx="2"/><rect x="198" y="318" width="12" height="138" rx="2"/></g>
    <path d="M60 330 C 64 360, 58 380, 62 410" stroke="#6b4a2c" stroke-width="3" opacity=".55" fill="none"/>
    <path d="M168 336 C 170 352, 166 366, 170 380" stroke="#6b4a2c" stroke-width="3" opacity=".45" fill="none"/>
    <rect x="18" y="330" width="16" height="10" rx="3" fill="#2b3e36"/><rect x="246" y="330" width="14" height="10" rx="3" fill="#2b3e36"/>
    <g><circle cx="66" cy="470" r="10" fill="#0b0d0e"/><circle cx="66" cy="470" r="4" fill="#6B6F6C"/><circle cx="214" cy="470" r="10" fill="#0b0d0e"/><circle cx="214" cy="470" r="4" fill="#6B6F6C"/></g>
  </g>
</svg>
