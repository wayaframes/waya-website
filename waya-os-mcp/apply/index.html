<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply · Waya OS Cohort</title>
<meta name="description" content="Apply for the Waya OS 12-week founder cohort.">
<link rel="icon" href="/assets/favicon.png">
<link rel="stylesheet" href="/assets/styles.css?v=5">
<style>
  :root{ --border-2: rgba(56,63,59,0.28); --shadow-2: 0 4px 14px rgba(31,36,34,0.08),0 1px 2px rgba(31,36,34,0.05); --waya-white:#FFFFFF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--waya-cream);
    color: var(--fg-1);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  img { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }

  .nav {
    position: sticky; top: 0; z-index: 50;
    background: rgba(250,247,241,0.92);
    backdrop-filter: saturate(140%) blur(8px);
    border-bottom: 1px solid var(--border-1);
  }
  .nav-inner {
    max-width: 900px; margin: 0 auto;
    padding: 18px 32px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-logo { height: 28px; }
  .nav-back {
    font-family: var(--font-display); font-size: 14px; font-weight: 500;
    color: var(--waya-charcoal); letter-spacing: -0.005em;
  }
  .nav-back:hover { color: var(--waya-rust); }

  .apply-head {
    max-width: 760px; margin: 0 auto;
    padding: 72px 32px 8px; text-align: center;
  }
  .apply-eyebrow {
    font-family: var(--font-display); font-size: 12px;
    letter-spacing: 0.18em; text-transform: uppercase;
    font-weight: 600; color: var(--waya-rust); margin-bottom: 16px;
  }
  .apply-head h1 {
    font-family: var(--font-display); font-weight: 700;
    font-size: 40px; line-height: 1.08; letter-spacing: -0.02em;
    color: var(--waya-charcoal); text-wrap: balance;
  }
  .apply-head p {
    margin: 18px auto 0; max-width: 560px;
    font-family: var(--font-body); font-size: 17px; line-height: 1.6;
    color: var(--fg-2); text-wrap: pretty;
  }

  .form-wrap {
    max-width: 760px; margin: 32px auto 0;
    padding: 0 24px 96px;
  }
  .form-card {
    background: var(--waya-white);
    border: 1px solid var(--border-1);
    border-radius: 18px;
    box-shadow: var(--shadow-2);
    padding: 12px;
  }
  .form-card iframe {
    width: 100%;
    min-height: 1121px;
    border: none;
    border-radius: 8px;
    display: block;
  }

  footer {
    background: var(--waya-charcoal);
    color: var(--fg-on-dark);
    padding: 40px 32px;
    text-align: center;
  }
  footer .footer-logo { height: 26px; opacity: 0.95; margin: 0 auto 14px; }
  footer .foot-bottom {
    font-family: var(--font-body); font-size: 13px;
    color: rgba(250,247,241,0.55);
  }

  @media (max-width: 640px) {
    .apply-head { padding-top: 52px; }
    .apply-head h1 { font-size: 30px; }
  }
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a href="/waya-os-mcp/cohort/" aria-label="Back to the cohort page">
      <img class="nav-logo" src="/assets/logos/waya-logo-charcoal-transparent.png" alt="Waya">
    </a>
    <a class="nav-back" href="/waya-os-mcp/cohort/">&#8249; Back to the cohort</a>
  </div>
</header>

<section class="apply-head">
  <div class="apply-eyebrow">Waya OS · 12-Week Founder Cohort</div>
  <h1>Apply for the cohort</h1>
  <p>A few details and you are in the queue. After you submit, you will come back to the cohort page with exactly what happens next.</p>
</section>

<div class="form-wrap">
  <div class="form-card">
    <!-- GHL order form widget (product: Waya OS 12-Week Founder Cohort). Redirect after
         payment is set in GHL (form settings > On Submit > Open URL) to the /waya-os-mcp/welcome/ page. -->
    <iframe
        src="https://api.leadconnectorhq.com/widget/form/LXcmFPl3FRQJ88JoJBnf"
        style="width:100%;min-height:1078px;border:none;border-radius:8px"
        id="inline-LXcmFPl3FRQJ88JoJBnf"
        data-layout="{'id':'INLINE'}"
        data-trigger-type="alwaysShow"
        data-trigger-value=""
        data-activation-type="alwaysActivated"
        data-activation-value=""
        data-deactivation-type="neverDeactivate"
        data-deactivation-value=""
        data-form-name="Waya OS Founder Cohort order form"
        data-height="1078"
        data-layout-iframe-id="inline-LXcmFPl3FRQJ88JoJBnf"
        data-form-id="LXcmFPl3FRQJ88JoJBnf"
        data-cookie-consent="true"
        data-cookie-consent-provider="auto"
        title="Waya OS Founder Cohort order form">
    </iframe>
  </div>
</div>

<footer>
  <a href="/">
    <img class="footer-logo" src="/assets/logos/waya-logo-cream.png" alt="Waya">
  </a>
  <div class="foot-bottom">&copy; Copyright 2026 &ndash; WayaFrames &ndash; All rights reserved.</div>
</footer>

<script src="https://link.msgsndr.com/js/form_embed.js"></script>
</body>
</html>
